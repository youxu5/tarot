<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>翠玉录 · 数据体检</title>
<style>
  body{margin:0;padding:24px;background:#0f1a18;color:#e8dfcf;font:15px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  h1{font-size:19px;font-weight:600;margin:0 0 4px}
  .sub{color:#8fa39c;font-size:13px;margin-bottom:18px}
  .row{padding:11px 14px;margin:8px 0;border-radius:10px;background:#16241f;border-left:4px solid #3d4f49}
  .ok{border-left-color:#4caf7d}
  .bad{border-left-color:#c1503f}
  .wait{border-left-color:#c8a558}
  .k{font-weight:600}
  .d{color:#9db0a8;font-size:13px;word-break:break-all;margin-top:4px}
  .btn{margin-top:16px;padding:10px 18px;border:0;border-radius:8px;background:#c8a558;color:#1a1410;font-size:15px;font-weight:600;cursor:pointer}
  .big{margin-top:20px;padding:14px;border-radius:10px;background:#16241f;font-size:16px;font-weight:600}
</style>
</head>
<body>
<h1>翠玉录 · 数据体检</h1>
<div class="sub">跑一遍读写，全绿就说明一个链接的方案成了。把结果截给我就行。</div>
<div id="out"></div>
<div class="big" id="verdict">检测中…</div>
<button class="btn" onclick="run()">再跑一次</button>

<script src="js/config.js?v=99"></script>
<script>
var box = document.getElementById('out'), verdict = document.getElementById('verdict');
function row(cls, k, d){ var p=document.createElement('div'); p.className='row '+cls;
  p.innerHTML='<div class="k">'+k+'</div>'+(d?'<div class="d">'+d+'</div>':''); box.appendChild(p); }

async function run(){
  box.innerHTML=''; verdict.textContent='检测中…'; verdict.className='big wait';
  var fails = 0;

  var cfg = (typeof CONFIG!=='undefined' && CONFIG.supabase) ? CONFIG.supabase : null;
  if(!cfg || !cfg.url || !cfg.anonKey){
    row('bad','① 配置读取失败','页面没加载到 Supabase 配置，检查 js/config.js 是否最新');
    verdict.textContent='结论：配置缺失'; verdict.className='big bad'; return;
  }
  row('ok','① 配置已读到','项目：'+cfg.url.replace('https://','')+'　表：'+cfg.table);

  var base = cfg.url.replace(/\/+$/,'') + '/rest/v1/' + cfg.table;
  var H = { apikey: cfg.anonKey, Authorization: 'Bearer '+cfg.anonKey, Accept:'application/json' };

  // ② 读（表是否存在、能否跨域读）
  var readOK = false;
  try{
    var r = await fetch(base + '?select=id,rev,created_at&limit=3', { headers:H, cache:'no-store' });
    if(r.ok){ var j = await r.json(); readOK = true;
      row('ok','② 读取成功','HTTP '+r.status+'，表里现有 '+j.length+' 行');
    } else {
      var t = await r.text(); fails++;
      row('bad','② 读取失败','HTTP '+r.status+'：'+t.slice(0,200));
    }
  }catch(e){ fails++;
    row('bad','② 读取失败（连不上）','要么是网络到不了 Supabase，要么是跨域没放行：'+e.message);
  }

  // ③ 写入 + ④ 删除（权限是否放开）
  var newId = null;
  var stamp = Date.now();
  try{
    var p = await fetch(base, { method:'POST',
      headers: Object.assign({}, H, {'Content-Type':'application/json','Prefer':'return=representation'}),
      body: JSON.stringify({ page:cfg.page, key:'__diag__', ix:999, url:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7', rev:stamp, created_at:new Date().toISOString() })
    });
    if(p.ok){ var arr = await p.json(); newId = (arr && arr[0] && arr[0].id);
      row('ok','③ 写入成功','HTTP '+p.status+'，新行 id='+newId);
    } else { var pt = await p.text(); fails++;
      row('bad','③ 写入失败','HTTP '+p.status+'：'+pt.slice(0,200)+'　（多半是建表 SQL 没跑完，或 RLS 策略没建）');
    }
  }catch(e){ fails++; row('bad','③ 写入失败','连不上：'+e.message); }

  if(newId != null){
    try{
      var d = await fetch(base + '?id=eq.'+newId, { method:'DELETE', headers:H });
      if(d.ok) row('ok','④ 删除成功','测试行已清理干净');
      else { fails++; row('bad','④ 删除失败','HTTP '+d.status); }
    }catch(e){ fails++; row('bad','④ 删除失败','连不上：'+e.message); }
  } else {
    row('wait','④ 删除跳过','前面没写成，这步没意义');
  }

  if(fails === 0){
    verdict.textContent = '结论：全绿 ✅ 一个链接的方案已经成立了';
    verdict.className = 'big ok';
  } else {
    verdict.textContent = '结论：有 '+fails+' 项没过 ❌ 把上面红色那条截给我';
    verdict.className = 'big bad';
  }
}
run();
</script>
</body>
</html>
